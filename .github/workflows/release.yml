name: Publish verified release
on:
  push:
    tags: ['v*']
    branches: [main]
    paths: ['releases/*/PUBLISH']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag
        required: true
        default: v0.1.2
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - name: Resolve immutable release source
        id: target
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_REF: ${{ github.ref }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          expected_commit=''
          if [ "$EVENT_NAME" = 'workflow_dispatch' ]; then
            release_tag="$INPUT_TAG"
          elif [[ "$PUSH_REF" == refs/tags/* ]]; then
            release_tag="${PUSH_REF#refs/tags/}"
          else
            release_tag="v$(node -p 'require("./package.json").version')"
            IFS= read -r expected_commit < "releases/$release_tag/PUBLISH"
            [[ "$expected_commit" =~ ^[0-9a-f]{40}$ ]]
          fi
          [[ "$release_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          git fetch --depth=1 origin tag "$release_tag"
          actual_commit=$(git rev-parse "$release_tag^{commit}")
          if [ -n "$expected_commit" ]; then
            test "$actual_commit" = "$expected_commit"
          fi
          git checkout --detach "$actual_commit"
          test "v$(node -p 'require("./package.json").version')" = "$release_tag"
          echo "tag=$release_tag" >> "$GITHUB_OUTPUT"
      - name: Select signed payload source
        id: payload
        env:
          RELEASE_TAG: ${{ steps.target.outputs.tag }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "v$(node -p 'require("./package.json").version')" = "$RELEASE_TAG"
          test -s "releases/$RELEASE_TAG/NOTES.md"
          if compgen -G "releases/$RELEASE_TAG/*.apk" >/dev/null || compgen -G "releases/$RELEASE_TAG/*.rpk" >/dev/null || test -f "releases/$RELEASE_TAG/SHA256SUMS"; then
            test -f "releases/$RELEASE_TAG/SHA256SUMS"
            test -f "releases/$RELEASE_TAG/rw6-ha-android-${RELEASE_TAG#v}.apk"
            test -f "releases/$RELEASE_TAG/com.vela.rw6ha.release.${RELEASE_TAG#v}.rpk"
            echo 'prebuilt=true' >> "$GITHUB_OUTPUT"
          else
            echo 'prebuilt=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Load existing protected signing identity
        if: steps.payload.outputs.prebuilt == 'false'
        run: node scripts/load-signing.cjs
        env:
          HA_RELEASE_PRIVATE_KEY_PEM: ${{ secrets.HA_RELEASE_PRIVATE_KEY_PEM }}
          HA_RELEASE_CERTIFICATE_PEM: ${{ secrets.HA_RELEASE_CERTIFICATE_PEM }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: ''
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Rebuild Android and run native regressions
        run: |
          set -o pipefail
          if ./gradlew --no-daemon :app:assembleRelease :app:testReleaseUnitTest :app:lintRelease 2>&1 | tee "$RUNNER_TEMP/rw6-android-build.log"; then
            exit 0
          else
            build_status=$?
            python3 - <<'PYLOG'
          import os
          from pathlib import Path
          lines = Path(os.environ['RUNNER_TEMP'], 'rw6-android-build.log').read_text(errors='replace').splitlines()
          message = '\n'.join(lines[-70:])
          message = message.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print('::error title=Android release build failed::' + message)
          PYLOG
            exit "$build_status"
          fi
        working-directory: android
      - run: npm run test:interop
      - name: Rebuild watch and exercise compiled screens
        run: |
          npm run build
          npm run verify:rpk -- dist/*.debug.*.rpk
          npm run smoke:rpk -- dist/*.debug.*.rpk
      - name: Build and stage signed installable pair
        if: steps.payload.outputs.prebuilt == 'false'
        env:
          RELEASE_TAG: ${{ steps.target.outputs.tag }}
        run: |
          set -euo pipefail
          npm run release
          bash scripts/sign-apk.sh
          cp "dist/rw6-ha-android-${RELEASE_TAG#v}.apk" "releases/$RELEASE_TAG/"
          cp "dist/com.vela.rw6ha.release.${RELEASE_TAG#v}.rpk" "releases/$RELEASE_TAG/"
          cp THIRD_PARTY_NOTICES.txt "releases/$RELEASE_TAG/THIRD_PARTY_NOTICES.txt"
          cd "releases/$RELEASE_TAG"
          sha256sum *.apk *.rpk THIRD_PARTY_NOTICES.txt > SHA256SUMS
      - name: Verify exact signed release payload
        env:
          RELEASE_TAG: ${{ steps.target.outputs.tag }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "v$(node -p 'require("./package.json").version')" = "$RELEASE_TAG"
          npm run verify:rpk -- "releases/$RELEASE_TAG/"*.rpk
          npm run smoke:rpk -- "releases/$RELEASE_TAG/"*.rpk
          npm run verify:apk -- "releases/$RELEASE_TAG/"*.apk
          cd "releases/$RELEASE_TAG"
          sha256sum -c SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: signed-release-${{ steps.target.outputs.tag }}
          path: |
            releases/${{ steps.target.outputs.tag }}/*.apk
            releases/${{ steps.target.outputs.tag }}/*.rpk
            releases/${{ steps.target.outputs.tag }}/SHA256SUMS
            releases/${{ steps.target.outputs.tag }}/THIRD_PARTY_NOTICES.txt
            releases/${{ steps.target.outputs.tag }}/NOTES.md
          if-no-files-found: error
      - name: Publish exact verified artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.target.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo 'Existing release preserved.'
            exit 0
          fi
          gh release create "$RELEASE_TAG" "releases/$RELEASE_TAG/"*.apk "releases/$RELEASE_TAG/"*.rpk \
            "releases/$RELEASE_TAG/SHA256SUMS" "releases/$RELEASE_TAG/THIRD_PARTY_NOTICES.txt" \
            --verify-tag --prerelease --title "Redmi Watch 6 Home Assistant $RELEASE_TAG" \
            --notes-file "releases/$RELEASE_TAG/NOTES.md"
      - name: Remove private signing files
        if: always()
        run: rm -rf sign/release
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: release-validation-reports
          path: android/app/build/reports/
